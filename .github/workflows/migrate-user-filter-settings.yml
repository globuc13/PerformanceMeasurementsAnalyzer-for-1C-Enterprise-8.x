name: Migrate user filter settings

on:
  push:
    branches:
      - feature/user-presentation-filter

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-presentation-filter
          fetch-depth: 0
      - name: Patch object module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl')
          text = path.read_text(encoding='utf-8-sig')

          old_handler = (
              'Процедура ПередЗагрузкойНастроекВКомпоновщик(\n'
              '\tКонтекст,\n'
              '\tКлючСхемы,\n'
              '\tКлючВарианта,\n'
              '\tНовыеНастройкиКД,\n'
              '\tНовыеПользовательскиеНастройкиКД) Экспорт\n'
              '\t\n'
              '\tЕсли НовыеНастройкиКД = Неопределено Тогда\n'
              '\t\tВозврат;\n'
              '\tКонецЕсли;\n'
              '\t\n'
              '\tЭлементОтбораПользователь = НайтиЭлементОтбораПользователь(НовыеНастройкиКД);\n'
              '\tЕсли ЭлементОтбораПользователь = Неопределено Тогда\n'
              '\t\tВозврат;\n'
              '\tКонецЕсли;\n'
              '\t\n'
              '\tЕсли Не ДоступенСписокПользователейИБ() Тогда\n'
              '\t\tЭлементОтбораПользователь.Использование = Ложь;\n'
              '\t\tСообщитьОНедоступностиСпискаПользователей();\n'
              '\tКонецЕсли;\n'
              '\t\n'
              'КонецПроцедуры\n'
          )

          new_handler = (
              'Процедура ПередЗагрузкойНастроекВКомпоновщик(\n'
              '\tКонтекст,\n'
              '\tКлючСхемы,\n'
              '\tКлючВарианта,\n'
              '\tНовыеНастройкиКД,\n'
              '\tНовыеПользовательскиеНастройкиКД) Экспорт\n'
              '\t\n'
              '\tЕсли НовыеНастройкиКД = Неопределено Тогда\n'
              '\t\tВозврат;\n'
              '\tКонецЕсли;\n'
              '\t\n'
              '\tЭлементОтбораПользователь = НайтиЭлементОтбораПользователь(НовыеНастройкиКД);\n'
              '\tЕсли ЭлементОтбораПользователь = Неопределено Тогда\n'
              '\t\tВозврат;\n'
              '\tКонецЕсли;\n'
              '\t\n'
              '\tНастроитьЭлементОтбораПользователь(ЭлементОтбораПользователь);\n'
              '\t\n'
              '\tЕсли ТипЗнч(НовыеПользовательскиеНастройкиКД) =\n'
              '\t\tТип("ПользовательскиеНастройкиКомпоновкиДанных") Тогда\n'
              '\t\t\n'
              '\t\tДля Каждого ЭлементПользовательскойНастройки Из\n'
              '\t\t\tНовыеПользовательскиеНастройкиКД.Элементы Цикл\n'
              '\t\t\t\n'
              '\t\t\tЕсли ТипЗнч(ЭлементПользовательскойНастройки) =\n'
              '\t\t\t\tТип("ЭлементОтбораКомпоновкиДанных")\n'
              '\t\t\t\tИ ЭлементПользовательскойНастройки.ИдентификаторПользовательскойНастройки =\n'
              '\t\t\t\t\tЭлементОтбораПользователь.ИдентификаторПользовательскойНастройки Тогда\n'
              '\t\t\t\t\n'
              '\t\t\t\tНастроитьЭлементОтбораПользователь(ЭлементПользовательскойНастройки);\n'
              '\t\t\t\tПрервать;\n'
              '\t\t\tКонецЕсли;\n'
              '\t\tКонецЦикла;\n'
              '\tКонецЕсли;\n'
              '\t\n'
              '\tЕсли Не ДоступенСписокПользователейИБ() Тогда\n'
              '\t\tЭлементОтбораПользователь.Использование = Ложь;\n'
              '\t\tСообщитьОНедоступностиСпискаПользователей();\n'
              '\tКонецЕсли;\n'
              '\t\n'
              'КонецПроцедуры\n'
          )

          if text.count(old_handler) != 1:
              raise SystemExit('handler block not found exactly once')
          text = text.replace(old_handler, new_handler)

          anchor = (
              '#Область СлужебныеФункцииОтбораПользователей\n\n'
              'Функция НайтиЭлементОтбораПользователь(НастройкиКД)\n'
          )
          helper = (
              '#Область СлужебныеФункцииОтбораПользователей\n\n'
              'Процедура НастроитьЭлементОтбораПользователь(ЭлементОтбораПользователь)\n'
              '\t\n'
              '\tИсходноеПравоеЗначение = ЭлементОтбораПользователь.ПравоеЗначение;\n'
              '\tЭлементОтбораПользователь.ВидСравнения = ВидСравненияКомпоновкиДанных.ВСписке;\n'
              '\tЭлементОтбораПользователь.РежимОтображения =\n'
              '\t\tРежимОтображенияЭлементаНастройкиКомпоновкиДанных.БыстрыйДоступ;\n'
              '\t\n'
              '\tЕсли ТипЗнч(ИсходноеПравоеЗначение) <> Тип("СписокЗначений") Тогда\n'
              '\t\tПравоеЗначение = Новый СписокЗначений;\n'
              '\t\tЕсли ЗначениеЗаполнено(ИсходноеПравоеЗначение) Тогда\n'
              '\t\t\tПравоеЗначение.Добавить(ИсходноеПравоеЗначение);\n'
              '\t\tКонецЕсли;\n'
              '\t\tЭлементОтбораПользователь.ПравоеЗначение = ПравоеЗначение;\n'
              '\tКонецЕсли;\n'
              '\t\n'
              '\tЕсли Не ЗначениеЗаполнено(\n'
              '\t\tЭлементОтбораПользователь.ИдентификаторПользовательскойНастройки) Тогда\n'
              '\t\t\n'
              '\t\tЭлементОтбораПользователь.ИдентификаторПользовательскойНастройки =\n'
              '\t\t\t"ОтборПользователей";\n'
              '\tКонецЕсли;\n'
              '\t\n'
              'КонецПроцедуры\n\n'
              'Функция НайтиЭлементОтбораПользователь(НастройкиКД)\n'
          )

          if text.count(anchor) != 1:
              raise SystemExit('helper anchor not found exactly once')
          text = text.replace(anchor, helper)
          path.write_text(text, encoding='utf-8-sig')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl'
          git commit -m 'Мигрировать сохранённый отбор пользователей в список'
          git push
