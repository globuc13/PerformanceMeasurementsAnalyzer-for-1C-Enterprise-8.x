name: Apply user filter source fix

on:
  push:
    branches:
      - feature/user-presentation-filter
    paths:
      - tools/apply_user_filter_source_fix.py
      - .github/workflows/apply-user-filter-source-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/user-presentation-filter
          fetch-depth: 0

      - name: Apply and validate source changes
        run: python tools/apply_user_filter_source_fix.py

      - name: Commit canonical source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl
          git add src/АнализЗамеровПроизводительности/Templates/ОсновнаяСхемаКомпоновкиДанных/Ext/Template.xml
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Исправить декларативные настройки отбора пользователей"
            git push origin HEAD:feature/user-presentation-filter
          fi
