name: Apply BSP choice guard

on:
  push:
    branches:
      - feature/user-presentation-filter

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-presentation-filter
          fetch-depth: 0
      - name: Patch object module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl')
          text = path.read_text(encoding='utf-8-sig')
          old = '''Процедура ПриОпределенииПараметровВыбора(Форма, СвойстваНастройки) Экспорт
	
	Если Строка(СвойстваНастройки.ПолеКД) <> "Пользователь" Тогда
'''
          new = '''Процедура ПриОпределенииПараметровВыбора(Форма, СвойстваНастройки) Экспорт
	
	Если СвойстваНастройки.ДоступнаяНастройкаКД = Неопределено Тогда
		Возврат;
	КонецЕсли;
	
	Если Строка(СвойстваНастройки.ПолеКД) <> "Пользователь" Тогда
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'unexpected replacement count: {count}')
          path.write_text(text.replace(old, new), encoding='utf-8-sig')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl'
          git commit -m 'Игнорировать первый вызов параметров выбора без описания'
          git push
