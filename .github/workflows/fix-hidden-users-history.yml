name: Fix hidden users history

on:
  push:
    branches:
      - feature/user-presentation-filter

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-presentation-filter
          fetch-depth: 0
      - name: Patch object module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl')
          text = path.read_text(encoding='utf-8-sig')

          old = (
              '\tРезультат.Вставить("Доступен", Истина);\n'
              '\tРезультат.Вставить("Значения", Новый СписокЗначений);\n'
              '\tРезультат.Вставить("ТекстОшибки", "");\n'
          )
          new = (
              '\tРезультат.Вставить("Доступен", Истина);\n'
              '\tРезультат.Вставить("Значения", Новый СписокЗначений);\n'
              '\tРезультат.Вставить("СкрытыеЗначения", Новый Соответствие);\n'
              '\tРезультат.Вставить("ТекстОшибки", "");\n'
          )
          if text.count(old) != 1:
              raise SystemExit('result block not found exactly once')
          text = text.replace(old, new)

          old = (
              '\t\tЕсли Не ПоказыватьНеактивныхПользователей\n'
              '\t\t\tИ ПользовательДолженБытьСкрыт(\n'
              '\t\t\t\tОписаниеПользователяИБ,\n'
              '\t\t\t\tПользовательПриложения) Тогда\n'
              '\t\t\t\n'
              '\t\t\tПродолжить;\n'
              '\t\tКонецЕсли;\n'
          )
          new = (
              '\t\tЕсли Не ПоказыватьНеактивныхПользователей\n'
              '\t\t\tИ ПользовательДолженБытьСкрыт(\n'
              '\t\t\t\tОписаниеПользователяИБ,\n'
              '\t\t\t\tПользовательПриложения) Тогда\n'
              '\t\t\t\n'
              '\t\t\tДобавитьСкрытыеПредставленияПользователя(\n'
              '\t\t\t\tРезультат.СкрытыеЗначения,\n'
              '\t\t\t\tИсторическиеЗначения,\n'
              '\t\t\t\tИмяПользователяИБ,\n'
              '\t\t\t\tПользовательПриложения);\n'
              '\t\t\tПродолжить;\n'
              '\t\tКонецЕсли;\n'
          )
          if text.count(old) != 1:
              raise SystemExit('hidden-user branch not found exactly once')
          text = text.replace(old, new)

          old = (
              '\tДля Каждого ЭлементСписка Из ИсторическиеЗначения Цикл\n'
              '\t\tЕсли ДобавленныеЗначения.Получить(Строка(ЭлементСписка.Значение)) = Неопределено Тогда\n'
          )
          new = (
              '\tДля Каждого ЭлементСписка Из ИсторическиеЗначения Цикл\n'
              '\t\tКлючИсторическогоЗначения = Строка(ЭлементСписка.Значение);\n'
              '\t\tЕсли РезультатПолучения.СкрытыеЗначения.Получить(КлючИсторическогоЗначения) = Неопределено\n'
              '\t\t\tИ ДобавленныеЗначения.Получить(КлючИсторическогоЗначения) = Неопределено Тогда\n'
          )
          if text.count(old) != 1:
              raise SystemExit('historical loop not found exactly once')
          text = text.replace(old, new)

          anchor = (
              'Функция ПолучитьПользователейПриложения(ОписанияПользователейИБ)\n'
          )
          helper = (
              'Процедура ДобавитьСкрытыеПредставленияПользователя(\n'
              '\tСкрытыеЗначения,\n'
              '\tИсторическиеЗначения,\n'
              '\tИмяПользователяИБ,\n'
              '\tПользовательПриложения)\n'
              '\t\n'
              '\tЕсли ПользовательПриложения <> Неопределено Тогда\n'
              '\t\tТекущееПредставление = ИмяПользователяИБ + "; " + ПользовательПриложения.Наименование;\n'
              '\tИначе\n'
              '\t\tТекущееПредставление = ИмяПользователяИБ;\n'
              '\tКонецЕсли;\n'
              '\tСкрытыеЗначения.Вставить(ТекущееПредставление, Истина);\n'
              '\t\n'
              '\tПрефиксПользователя = ИмяПользователяИБ + ";";\n'
              '\tДля Каждого ИсторическоеЗначение Из ИсторическиеЗначения Цикл\n'
              '\t\tПредставлениеПользователя = Строка(ИсторическоеЗначение.Значение);\n'
              '\t\tЕсли ПредставлениеПользователя = ИмяПользователяИБ\n'
              '\t\t\tИли СтрНачинаетсяС(ПредставлениеПользователя, ПрефиксПользователя) Тогда\n'
              '\t\t\tСкрытыеЗначения.Вставить(ПредставлениеПользователя, Истина);\n'
              '\t\tКонецЕсли;\n'
              '\tКонецЦикла;\n'
              '\t\n'
              'КонецПроцедуры\n\n'
              'Функция ПолучитьПользователейПриложения(ОписанияПользователейИБ)\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('helper anchor not found exactly once')
          text = text.replace(anchor, helper)

          path.write_text(text, encoding='utf-8-sig')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 'src/АнализЗамеровПроизводительности/Ext/ObjectModule.bsl'
          git commit -m 'Не возвращать скрытых пользователей из истории'
          git push
